services:
  app-test:
    build:
      context: .
      target: test
    environment:
      SOLANA_CLUSTER: devnet

  app-dev:
    build:
      context: .
      target: dev
    env_file:
      - .env
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

volumes:
  app_node_modules:
